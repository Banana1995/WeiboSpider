services:
  weibospider:
    build: .
    container_name: weibospider
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - ./data:/app/weibospider/data
    restart: unless-stopped
    environment:
      - CHROME_PATH=/usr/bin/chromium
      - DB_PATH=/app/weibospider/data/data.db

  platform:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.platform
    environment:
      BACKEND_ADDR: 0.0.0.0:5051
      BACKEND_DATA_DIR: /app/data
      LIQUOR_AUTO_SYNC: "true"
      LEDGER_ENABLED: "true"
      LEDGER_MCP_ENABLED: "true"
      LEDGER_WEEKLY_ENABLED: "false"
    volumes:
      - platform-data:/app/data

  market-entry:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5052:8080"
    restart: unless-stopped
    env_file:
      - .env.platform
    depends_on:
      - platform
      - weibospider

  site-tls:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - site-certificates:/data
      - site-caddy-config:/config
    depends_on:
      - market-entry

volumes:
  platform-data:
  site-certificates:
  site-caddy-config:
