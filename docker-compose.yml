services:
  weibospider:
    build: .
    container_name: weibospider
    ports:
      - "5050:5050"
    volumes:
      - ./data:/app/weibospider/data
    restart: unless-stopped
    environment:
      - CHROME_PATH=/usr/bin/chromium
      - DB_PATH=/app/weibospider/data/data.db

  platform:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.platform
    environment:
      BACKEND_ADDR: 0.0.0.0:5051
      BACKEND_DATA_DIR: /app/data
      LIQUOR_AUTO_SYNC: "true"
    volumes:
      - platform-data:/app/data

  market-entry:
    build:
      context: ./frontend
    ports:
      - "5052:8080"
    restart: unless-stopped
    env_file:
      - .env.platform
    depends_on:
      - platform

volumes:
  platform-data:
